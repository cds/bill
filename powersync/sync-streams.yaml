                )
            )
          )
      - |
        SELECT expenses.*
        FROM expenses
        WHERE expenses.deleted_at IS NULL
          AND (
            expenses.tenant_id IN (
              SELECT tenant_id
              FROM tenant_members
              WHERE user_id = auth.user_id()
