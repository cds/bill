config:
  edition: 3

streams:
  tenant_data:
    queries:
      - |
        SELECT items.*
        FROM items
        WHERE items.deleted_at IS NULL
          AND items.tenant_id = subscription.parameter('tenant_id')
          AND (
            subscription.parameter('tenant_id') IN (
              SELECT tenant_id
              FROM tenant_members
              WHERE user_id = auth.user_id()
            )
            OR subscription.parameter('tenant_id') IN (
              SELECT id
              FROM tenants
              WHERE auth.user_id() IN (
                SELECT id
                FROM users
                WHERE system_role = 'super_admin'
              )
            )
          )
      - |
        SELECT parties.*
        FROM parties
        WHERE parties.deleted_at IS NULL
          AND parties.tenant_id = subscription.parameter('tenant_id')
          AND (
            subscription.parameter('tenant_id') IN (
              SELECT tenant_id
              FROM tenant_members
              WHERE user_id = auth.user_id()
            )
            OR subscription.parameter('tenant_id') IN (
              SELECT id
              FROM tenants
              WHERE auth.user_id() IN (
                SELECT id
                FROM users
                WHERE system_role = 'super_admin'
              )
            )
          )
